services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dashboard
      MYSQL_USER: dashboard_user
      MYSQL_PASSWORD: dashboard_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: dashboard_user
      DATABASE_PASSWORD: dashboard_pass
      DATABASE_NAME: dashboard
      DATABASE_URL: mysql://dashboard_user:dashboard_pass@db:3306/dashboard
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  db_data:
