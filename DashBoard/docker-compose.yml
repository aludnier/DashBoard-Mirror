services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dashboard
      MYSQL_USER: dashboard_user
      MYSQL_PASSWORD: dashboard_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: mysql://dashboard_user:dashboard_pass@db:3306/dashboard
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  db_data:
